name: CI Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Caminho padrão do SDK no runner-image (variáveis do runner não são
# visíveis em expressões de env: — usar constante do workflow).
env:
  ANDROID_SDK: /usr/local/lib/android/sdk

jobs:
  apk:
    name: assembleDebug (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK + CMake + platform (SDK oficial — §XXXI)
        env:
          SDKMANAGER: ${{ env.ANDROID_SDK }}/cmdline-tools/latest/bin/sdkmanager
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "ndk;27.0.12077973" \
            "cmake;3.31.6" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_SDK/ndk" && "$ANDROID_SDK/cmake/3.31.6/bin/cmake" --version | head -1

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Inspeção do APK (evidência §XXV/§XXXIX)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK ausente"; exit 1; }
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libgoni.so|AndroidManifest'
          NDK_LLVM="$ANDROID_SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TMP=$(mktemp -d)
          unzip -q "$APK" lib/arm64-v8a/libgoni.so -d "$TMP"
          file "$TMP/lib/arm64-v8a/libgoni.so"
          "$NDK_LLVM/llvm-readelf" -d "$TMP/lib/arm64-v8a/libgoni.so" | grep NEEDED
          # Símbolos JNI obrigatórios (missão §XXV.7)
          "$NDK_LLVM/llvm-nm" -D "$TMP/lib/arm64-v8a/libgoni.so" | grep Java_com_goni
          "$ANDROID_SDK/build-tools/34.0.0/aapt" dump badging "$APK" | head -6

      - name: Upload do APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: goni-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
